name: ALIO 실서버 점검

# ALIO 는 공개 API 가 아니라 사이트가 바뀌면 조용히 깨질 수 있다. 매주 실제로 호출해 확인한다.
# 실패하면 GitHub 가 레포 소유자에게 알림을 보낸다.
on:
  schedule:
    - cron: "0 0 * * 1" # 매주 월요일 09:00 (한국)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=optional --ignore-scripts

      - name: ALIO 접속 확인
        run: |
          curl -sS -m 20 -o /dev/null -w "HTTP %{http_code}, 연결 %{time_connect}s, 전체 %{time_total}s, 원격 %{remote_ip}\n" https://www.alio.go.kr/ \
            || { echo "::error::이 러너에서 ALIO(www.alio.go.kr)에 접속할 수 없습니다. 사이트 장애나 일시적인 네트워크 문제일 수 있으니 다시 실행해 보세요."; exit 1; }

      - name: 사이트 구조 점검(기관 목록·검색·상세·첨부)
        run: npm run test:live

      - name: 모든 도구 실호출
        run: node test/e2e-smoke.mjs

      - name: 내규 조문 분할 회귀 벤치(실제 내규 106건)
        run: npm run bench

      - name: 비슷한 규정 찾기 품질 벤치(경영혁신 정답지·유연근무)
        run: npm run bench:related
